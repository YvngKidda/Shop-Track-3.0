<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9590427130766212"
     crossorigin="anonymous"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="theme-color" content="#1B4332" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ShopTrack" />
  <meta name="description" content="Plan. Shop. Track prices..." />
  <title>ShopTrack</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('st_theme');
        var preference = 'system';
        if (stored) {
          try { preference = JSON.parse(stored); } catch (error) { preference = stored; }
        }
        if (!stored) {
          var legacy = localStorage.getItem('st_dark_mode');
          if (legacy) {
            try { preference = JSON.parse(legacy) ? 'dark' : 'light'; } catch (error) { /* use system */ }
          }
        }
        if (!['light', 'dark', 'system'].includes(preference)) preference = 'system';
        var isDark = preference === 'dark'
          || (preference === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
      } catch (error) {
        document.documentElement.dataset.theme = 'light';
      }
    }());
  </script>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="192x192.png" type="image/png" />
  <link rel="apple-touch-icon" href="192x192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app"></div>
  <script src="script.js"></script>
</body>
</html>
